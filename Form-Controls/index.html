<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Form Controls</title>
  <!-- NB: instruction was to use no CSS in making this page! -->
</head>

<body>

  <header>
    <h1>Product Pick</h1>
  </header>

  <main>

    <form action="results.html" method="GET" enctype="multipart/form-data">

      <fieldset>
        <legend>Your details</legend>

        <div>
          <label for="name">Name :</label>
          <input type="text" id="name" name="user_name" placeholder="Jane Doe" minlength="2">
        </div>

        <br><br>

        <div>
          <label for="email">Email:</label>
          <input type="email" id="email" name="user_email" placeholder="yourname@email.com">
          <!-- input type email automatically checks that the input is in an email format -->
        </div>
      </fieldset>

      <br><br>

      <div>
        <label for="age">Age</label>
        <input type="number" name="age" id="age" min="1" maximum="200">
      </div>

      <div>
        <label for="date">Date</label>
        <input type="date" name="date" id="date">
      </div>


      <!-- the date input type can't accept placeholders, below is the start of a fix from geeksforgeeks.org -->

      <!-- <div>
        <label for="date">Date</label>
        <input type="text" placeholder="08/05/2025" onfocus="(this.type='date')">
      </div> -->


      <!-- Checkboxes -->
      <!-- NB each button is a separate potential input (so for= and id= are the same, as usual) but each input relates to the same "question" - they all relate to name=fav-colour -->
      <!-- NB because the user doesn't insert anything into the input (the checkbox gets ticked), you must add a "value" attribute to the input - this will be the data that is returned if the box is checked-->

      <fieldset>
        <h4>Favourite Fruit</h4>
        <div>
          <label for="banana">Banana</label>
          <input type="checkbox" name="favourite-fruit" id="banana" value="banana">
        </div>

        <div>
          <label for="strawberry">Strawberry</label>
          <input type="checkbox" name="favourite-fruit" id="strawberry" value="strawberry">
        </div>

        <div>
          <label for="Apple">Apple</label>
          <input type="checkbox" name="favourite-fruit" id="Apple" value="apple">
        </div>
      </fieldset>





      <!-- Radio buttons -->
      <!-- NB each button is a separate potential input (so for= and id= are the same, as usual) but each input relates to the same "question" - they all relate to name=fav-colour -->
      <!-- NB because the user doesn't insert anything into the input (the radio button gets filled in), you must add a "value" attribute to the input - this will be the data that is returned if the box is checked-->


      <fieldset>
        <h4> Favourite Colour </h4>
        <div>
          <label for="pink">Pink</label>
          <input type="radio" name="fav-colour" id="pink" value="pink">
        </div>

        <div>
          <label for="black"> Black</label>
          <input type="radio" name="fav-colour" id="black" value="black">
        </div>

        <div>
          <label for="orange">Orange</label>
          <input type="radio" name="fav-colour" id="orange" value="orange">
        </div>
      </fieldset>

      <br><br><br>

      <fieldset>

        <legend>T-Shirt Selection</legend>

        <div>
          <label for="colour">Colour:</label>
          <select name="shirt_colour" id="colour">
            <option value="" disabled selected>--Please choose an option --</option>
            <!-- disabled: option not selectable, selected: displays as default on loading-->

            <option value="black"> Black </option>
            <option value="grey"> Grey </option>
            <option value="pink"> Pink </option>
          </select>
        </div>

        <br><br>

        <div>
          <label for="size">Size:</label>
          <select name="shirt_size" id="size">
            <option value="" disabled selected>--Please choose an option--</option>
            <option value="xtra-small"> XS </option>
            <option value="small"> S </option>
            <option value="medium"> M </option>
            <option value="large"> L </option>
            <option value="extra-large"> XL </option>
            <option value="2-extra-large"> XXL </option>
          </select>
      </fieldset>
      </div>


      <!-- Hidden inputs -->

      <div>
        <input type="hidden" name="hidden" value="this can't be read on the user facing form">
      </div>

      <br>


      <!-- File input -->
      <label for="file">File</label>
      <input type="file" name="file" id="file">


      <button type="Submit">
        Submit
      </button>

    </form>

  </main>

  <footer>
    <h2>By Amy-Rose Collins</h2>
  </footer>

</body>

</html>
